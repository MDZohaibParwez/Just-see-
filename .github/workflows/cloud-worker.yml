# Just See cloud worker: renders videos and listens to / looks at clips while
# the owner's phone and laptop are off. Free on GitHub Actions for this public
# repo. Needs the repo secret JUST_SEE_WORKER_KEY (same value as the API's
# WORKER_KEY / MCP_KEY). Prints nothing about the videos (logs are public).
name: Cloud worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cloud-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      JUST_SEE_API: https://just-see-api.vercel.app
      JUST_SEE_WORKER_KEY: ${{ secrets.JUST_SEE_WORKER_KEY }}
    steps:
      - name: Anything to do?
        id: peek
        run: |
          if [ -z "$JUST_SEE_WORKER_KEY" ]; then echo "Secret JUST_SEE_WORKER_KEY is not set."; echo "work=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          out=$(curl -sf -H "x-worker-key: $JUST_SEE_WORKER_KEY" "$JUST_SEE_API/api/worker/peek" || echo '{}')
          n=$(echo "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(int(d.get("analysis",0))+int(d.get("render",0)))' 2>/dev/null || echo 0)
          echo "jobs waiting: $n"
          echo "work=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.peek.outputs.work != '0'
        with:
          sparse-checkout: worker
      - uses: actions/setup-node@v4
        if: steps.peek.outputs.work != '0'
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: steps.peek.outputs.work != '0'
        with:
          python-version: "3.12"
      - name: Cache speech model
        if: steps.peek.outputs.work != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Install tools
        if: steps.peek.outputs.work != '0'
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper==1.2.1 numpy
          cd worker && npm init -y > /dev/null && npm install -q playwright@1.63.0 > /dev/null && npx playwright install --with-deps chromium > /dev/null
      - name: Work
        if: steps.peek.outputs.work != '0'
        run: node worker/run.mjs
