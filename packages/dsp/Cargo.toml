[package]
name = "just-see-dsp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Audio DSP for Just See (noise reduction, HPSS stems, time-stretch, pitch shift), compiled to WebAssembly."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
